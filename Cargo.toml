[package]
name = "hip4"
version = "0.1.1"
edition = "2021"
description = "Deprecated: use df-hyperliquid-core. Rust SDK for Hyperliquid HIP-4 prediction markets"
license = "BUSL-1.1"
authors = ["Dennis Furrer"]
repository = "https://github.com/perps-studio/hip-4-rust"
homepage = "https://github.com/perps-studio/hip-4-rust"
readme = "README.md"
keywords = ["hyperliquid", "hip4", "prediction-markets", "trading", "crypto"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[badges]
maintenance = { status = "deprecated" }

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Crypto (secp256k1 ECDSA - the one thing we can't implement from scratch)
k256 = { version = "0.13", features = ["ecdsa"] }

# Utilities
rust_decimal = { version = "1.39", features = ["macros", "serde-str"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"

# Legacy signing (for comparison testing only)
hypersdk = { version = "0.2", optional = true }
alloy = { version = "1.5.2", features = ["signers", "signer-local", "sol-types"], optional = true }
either = { version = "1", optional = true }

[features]
default = []
# Enable to compare from-scratch signing output against hypersdk/alloy
compare = ["dep:hypersdk", "dep:alloy", "dep:either"]

[[example]]
name = "fetch_markets"
path = "examples/fetch_markets.rs"

[[example]]
name = "place_order"
path = "examples/place_order.rs"
